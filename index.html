<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- गूगल साइट वेरिफिकेशन टैग -->
    <meta name="google-site-verification" content="K3TaRCvOiyp29o8nM_OL7_dqZcPhPGoSS_iiDNVADkw" />

    <!-- गूगल खोज (SEO) सेटिंग्स -->
    <title>UB Perfumes - Buy Premium & Luxury Fragrances Online</title>
    <meta name="description" content="Buy premium, long-lasting luxury perfumes online at UB Perfumes. Explore our exclusive collection including Royal Kasturi, Chocolates, Mango Man. Order easily via WhatsApp.">
    <meta name="keywords" content="UB Perfumes, buy perfume online, luxury fragrances, Royal Kasturi, Chocolates, Mango Man">
    <meta name="robots" content="index, follow">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #0d0d0d; color: #ffffff; padding: 15px; }
        header { text-align: center; padding: 15px 0 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        h1 { font-size: 26px; letter-spacing: 4px; font-weight: 300; color: #f3e5ab; text-transform: uppercase; }

        /* Ultra Luxury Banner Slider */
        .slider-wrapper {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 25px auto;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 15px rgba(243, 229, 171, 0.2);
            border: 1px solid rgba(243, 229, 171, 0.3);
            background: #000;
            height: 250px;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .slide.active { opacity: 1; z-index: 1; }

        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1);
            transition: transform 6s ease-out;
        }

        .slide.active .slide-img {
            transform: scale(1.15); /* Luxury Ken Burns Zoom Effect */
        }

        /* Glassmorphism Dark Overlay */
        .slide-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 15px 15px 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 2;
        }

        .slide-badge {
            align-self: flex-start;
            background: rgba(243, 229, 171, 0.2);
            border: 1px solid #f3e5ab;
            color: #f3e5ab;
            font-size: 9px;
            letter-spacing: 2px;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 5px;
            backdrop-filter: blur(5px);
        }

        .slide-title {
            font-size: 18px;
            font-weight: 400;
            color: #fff;
            letter-spacing: 1px;
        }

        /* Luxury Gold Shine Animation */
        .slider-wrapper::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
            transform: rotate(30deg);
            animation: shine 7s infinite;
            pointer-events: none;
            z-index: 3;
        }

        @keyframes shine {
            0% { transform: translate(-100%, -100%) rotate(30deg); }
            20% { transform: translate(100%, 100%) rotate(30deg); }
            100% { transform: translate(100%, 100%) rotate(30deg); }
        }

        /* Dots & Progress Bar */
        .dots-container {
            position: absolute;
            bottom: 12px;
            right: 15px;
            display: flex;
            gap: 6px;
            z-index: 4;
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transition: all 0.4s ease;
        }

        .dot.active {
            width: 22px;
            border-radius: 10px;
            background: #f3e5ab;
            box-shadow: 0 0 8px #f3e5ab;
        }

        /* Product Cards Container */
        .container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { background: #141414; border: 1px solid rgba(255,255,255,0.08); border-radius: 15px; padding: 12px; display: flex; flex-direction: column; position: relative; }
        .image-container { width: 100%; padding-top: 100%; position: relative; overflow: hidden; border-radius: 10px; margin-bottom: 10px; }
        .product-img { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: cover; }
        
        .btn { display: block; background: #f3e5ab; color: #000; text-align: center; padding: 10px; border-radius: 20px; text-decoration: none; font-size: 12px; font-weight: bold; margin-top: auto; letter-spacing: 1px; }
        .card.out-of-stock .product-img { filter: grayscale(84%); opacity: 0.5; }
        .btn-out { background: #e53935; color: #fff; cursor: not-allowed; text-align: center; padding: 10px; border-radius: 20px; font-size: 12px; margin-top: auto; font-weight: bold; }
        .stock-tag { position: absolute; top: 15px; left: 15px; background: #e53935; color: white; padding: 3px 8px; font-size: 10px; border-radius: 5px; font-weight: bold; z-index: 2; }
        .loading { text-align: center; grid-column: span 2; font-size: 14px; color: #888; padding: 30px; }
    </style>
</head>
<body>

    <header>
        <h1>UB PERFUMES</h1>
    </header>

    <!-- Animated Luxury Hero Banner Slider -->
    <div class="slider-wrapper">
        <div class="slide active">
            <img class="slide-img" src="https://i.postimg.cc/Gm6NLs43/1784547021297.png" alt="Royal Kasturi">
            <div class="slide-overlay">
                <span class="slide-badge">Royal Collection</span>
                <h2 class="slide-title">Royal Kasturi</h2>
            </div>
        </div>
        <div class="slide">
            <img class="slide-img" src="https://i.postimg.cc/rmnw3h5j/1785151122893.png" alt="Chocolate">
            <div class="slide-overlay">
                <span class="slide-badge">Exclusive Edition</span>
                <h2 class="slide-title">Chocolate Fragrance</h2>
            </div>
        </div>

        <div class="dots-container">
            <div class="dot active"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="container" id="perfume-list">
        <div class="loading">उत्पाद लोड हो रहे हैं...</div>
    </div>

    <script>
        // High-end Smooth Slider Animation Logic
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        let currentSlide = 0;

        function showNextSlide() {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');

            currentSlide = (currentSlide + 1) % slides.length;

            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }

        setInterval(showNextSlide, 4500); // 4.5 Seconds per slide

        // Google Sheet Setup
        const SHEET_ID = '13rNvj9LgIuMGplhhNrScH8I8cwguZ5inDTzGphm1EqY'; 
        const WHATSAPP_NUMBER = '919898647697'; // अपना असली WhatsApp नंबर डालें

        window.renderPerfumes = function(data) {
            const container = document.getElementById('perfume-list');
            container.innerHTML = '';

            if (!data || !data.table || !data.table.rows || data.table.rows.length === 0) {
                container.innerHTML = '<div class="loading">शीट में कोई उत्पाद उपलब्ध नहीं है।</div>';
                return;
            }

            const rows = data.table.rows;

            rows.forEach((row) => {
                const cols = row.c;
                if (!cols || !cols[0] || !cols[0].v) return;

                const name = cols[0] ? String(cols[0].v).trim() : '';
                const price = cols[1] && cols[1].v !== null ? String(cols[1].v).trim() : '';
                const img = cols[3] && cols[3].v ? String(cols[3].v).trim() : 'https://via.placeholder.com/200';
                const stockStatus = cols[4] && cols[4].v ? String(cols[4].v).trim().toLowerCase() : '';
                
                const isOutOfStock = stockStatus.includes('out');

                if (!name) return;

                let actionButton = `<a href="https://wa.me/${WHATSAPP_NUMBER}?text=मुझे ${encodeURIComponent(name)} चाहिए" target="_blank" class="btn">WHATSAPP ORDER</a>`;
                let badge = '';
                let cardClass = 'card';

                if (isOutOfStock) {
                    actionButton = `<div class="btn-out">OUT OF STOCK</div>`;
                    badge = `<div class="stock-tag">OUT OF STOCK</div>`;
                    cardClass = 'card out-of-stock';
                }

                container.innerHTML += `
                    <div class="${cardClass}">
                        ${badge}
                        <div class="image-container"><img class="product-img" src="${img}" alt="${name}"></div>
                        <h3 style="font-size:14px; margin-bottom:5px; font-weight:400; letter-spacing:0.5px;">${name}</h3>
                        <p style="font-size:13px; color:#f3e5ab; margin-bottom:10px; font-weight:bold;">Rs. ${price}</p>
                        ${actionButton}
                    </div>
                `;
            });
        };

        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:renderPerfumes`;
        script.onerror = function() {
            document.getElementById('perfume-list').innerHTML = '<div class="loading">उत्पाद लोड करने में समस्या आई।</div>';
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
