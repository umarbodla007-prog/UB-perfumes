<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- गूगल साइट वेरिफिकेशन टैग -->
    <meta name="google-site-verification" content="K3TaRCvOiyp29o8nM_OL7_dqZcPhPGoSS_iiDNVADkw" />

    <!-- गूगल खोज (SEO) सेटिंग्स -->
    <title>UB Perfumes - Buy Premium & Luxury Fragrances Online</title>
    <meta name="description" content="Buy premium, long-lasting luxury perfumes online at UB Perfumes. Explore our exclusive collection including Royal Kasturi, Chocolates, Mango Man. Order easily via WhatsApp.">
    <meta name="keywords" content="UB Perfumes, buy perfume online, luxury fragrances, Royal Kasturi, Chocolates, Mango Man">
    <meta name="robots" content="index, follow">

    <!-- Google Font for Luxury Look -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: radial-gradient(circle at top, #1a1a1a 0%, #080808 100%); 
            color: #ffffff; 
            padding: 15px; 
            min-height: 100vh;
        }

        /* Ultra Premium Header */
        header { 
            text-align: center; 
            padding: 20px 0 15px 0; 
            margin-bottom: 20px;
            position: relative;
        }
        .brand-title { 
            font-family: 'Cinzel', serif; 
            font-size: 28px; 
            letter-spacing: 5px; 
            font-weight: 700; 
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        .brand-subtitle {
            font-size: 10px;
            letter-spacing: 4px;
            color: #888;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .gold-divider {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 10px auto 0 auto;
        }

        /* Ultra Luxury Banner Slider */
        .slider-wrapper {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 25px auto;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.25);
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: #000;
            height: 260px;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .slide.active { opacity: 1; z-index: 1; }

        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1);
            transition: transform 6s ease-out;
        }

        .slide.active .slide-img {
            transform: scale(1.15); /* Luxury Ken Burns Zoom Effect */
        }

        /* Glassmorphism Dark Overlay */
        .slide-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 25px 20px 20px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 2;
        }

        .slide-badge {
            align-self: flex-start;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #d4af37;
            color: #fcf6ba;
            font-size: 9px;
            letter-spacing: 2px;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 6px;
            backdrop-filter: blur(5px);
            font-weight: 600;
        }

        .slide-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
        }

        /* Luxury Gold Shine Animation */
        .slider-wrapper::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
            transform: rotate(30deg);
            animation: shine 6s infinite;
            pointer-events: none;
            z-index: 3;
        }

        @keyframes shine {
            0% { transform: translate(-100%, -100%) rotate(30deg); }
            20% { transform: translate(100%, 100%) rotate(30deg); }
            100% { transform: translate(100%, 100%) rotate(30deg); }
        }

        /* Dots & Progress Indicator */
        .dots-container {
            position: absolute;
            bottom: 15px;
            right: 20px;
            display: flex;
            gap: 6px;
            z-index: 4;
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.4s ease;
        }

        .dot.active {
            width: 24px;
            border-radius: 10px;
            background: #d4af37;
            box-shadow: 0 0 10px #d4af37;
        }

        /* Product Grid Container */
        .container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        
        .card { 
            background: linear-gradient(145deg, #141414, #0b0b0b); 
            border: 1px solid rgba(212, 175, 55, 0.15); 
            border-radius: 18px; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        
        .card:active {
            transform: scale(0.98);
            border-color: rgba(212, 175, 55, 0.5);
        }

        .image-container { width: 100%; padding-top: 100%; position: relative; overflow: hidden; border-radius: 12px; margin-bottom: 12px; }
        .product-img { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        
        .card:hover .product-img { transform: scale(1.08); }

        .btn { 
            display: block; 
            background: linear-gradient(135deg, #bf953f, #d4af37); 
            color: #000; 
            text-align: center; 
            padding: 10px; 
            border-radius: 20px; 
            text-decoration: none; 
            font-size: 11px; 
            font-weight: 700; 
            margin-top: auto; 
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
            text-transform: uppercase;
        }
        
        .card.out-of-stock .product-img { filter: grayscale(84%); opacity: 0.4; }
        .btn-out { background: #333; color: #888; cursor: not-allowed; text-align: center; padding: 10px; border-radius: 20px; font-size: 11px; margin-top: auto; font-weight: bold; }
        .stock-tag { position: absolute; top: 18px; left: 18px; background: #e53935; color: white; padding: 3px 8px; font-size: 9px; border-radius: 4px; font-weight: bold; z-index: 2; letter-spacing: 1px; }
        .loading { text-align: center; grid-column: span 2; font-size: 14px; color: #d4af37; padding: 40px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">UB PERFUMES</div>
        <div class="brand-subtitle">HAUTE PARFUMERIE • EST. 2026</div>
        <div class="gold-divider"></div>
    </header>

    <!-- Animated Luxury Hero Banner Slider -->
    <div class="slider-wrapper">
        <div class="slide active">
            <img class="slide-img" src="https://i.postimg.cc/Gm6NLs43/1784547021297.png" alt="Royal Kasturi">
            <div class="slide-overlay">
                <span class="slide-badge">Royal Collection</span>
                <h2 class="slide-title">Royal Kasturi</h2>
            </div>
        </div>
        <div class="slide">
            <img class="slide-img" src="https://i.postimg.cc/rmnw3h5j/1785151122893.png" alt="Chocolate">
            <div class="slide-overlay">
                <span class="slide-badge">Exclusive Edition</span>
                <h2 class="slide-title">Chocolate Fragrance</h2>
            </div>
        </div>

        <div class="dots-container">
            <div class="dot active"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="container" id="perfume-list">
        <div class="loading">LOADING LUXURY COLLECTION...</div>
    </div>

    <script>
        // High-end Smooth Slider Animation Logic
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        let currentSlide = 0;

        function showNextSlide() {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');

            currentSlide = (currentSlide + 1) % slides.length;

            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }

        setInterval(showNextSlide, 4500); // 4.5 Seconds per slide

        // Google Sheet Setup
        const SHEET_ID = '13rNvj9LgIuMGplhhNrScH8I8cwguZ5inDTzGphm1EqY'; 
        const WHATSAPP_NUMBER = '919898647697'; // अपना असली WhatsApp नंबर डालें

        window.renderPerfumes = function(data) {
            const container = document.getElementById('perfume-list');
            container.innerHTML = '';

            if (!data || !data.table || !data.table.rows || data.table.rows.length === 0) {
                container.innerHTML = '<div class="loading">शीट में कोई उत्पाद उपलब्ध नहीं है।</div>';
                return;
            }

            const rows = data.table.rows;

            rows.forEach((row) => {
                const cols = row.c;
                if (!cols || !cols[0] || !cols[0].v) return;

                const name = cols[0] ? String(cols[0].v).trim() : '';
                const price = cols[1] && cols[1].v !== null ? String(cols[1].v).trim() : '';
                const img = cols[3] && cols[3].v ? String(cols[3].v).trim() : 'https://via.placeholder.com/200';
                const stockStatus = cols[4] && cols[4].v ? String(cols[4].v).trim().toLowerCase() : '';
                
                const isOutOfStock = stockStatus.includes('out');

                if (!name) return;

                let actionButton = `<a href="https://wa.me/${WHATSAPP_NUMBER}?text=नमस्कार UB Perfumes, मुझे ${encodeURIComponent(name)} ऑर्डर करना है।" target="_blank" class="btn">ORDER VIA WHATSAPP</a>`;
                let badge = '';
                let cardClass = 'card';

                if (isOutOfStock) {
                    actionButton = `<div class="btn-out">SOLD OUT</div>`;
                    badge = `<div class="stock-tag">SOLD OUT</div>`;
                    cardClass = 'card out-of-stock';
                }

                container.innerHTML += `
                    <div class="${cardClass}">
                        ${badge}
                        <div class="image-container"><img class="product-img" src="${img}" alt="${name}"></div>
                        <h3 style="font-family:'Cinzel', serif; font-size:13px; margin-bottom:4px; font-weight:600; color:#fff; letter-spacing:0.5px;">${name}</h3>
                        <p style="font-size:13px; color:#d4af37; margin-bottom:10px; font-weight:600;">₹ ${price}</p>
                        ${actionButton}
                    </div>
                `;
            });
        };

        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:renderPerfumes`;
        script.onerror = function() {
            document.getElementById('perfume-list').innerHTML = '<div class="loading">उत्पाद लोड करने में समस्या आई।</div>';
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
