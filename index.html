<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- गूगल साइट वेरिफिकेशन टैग -->
    <meta name="google-site-verification" content="K3TaRCvOiyp29o8nM_OL7_dqZcPhPGoSS_iiDNVADkw" />

    <!-- SEO -->
    <title>UB PERFUMES — Haute Parfumerie Royale</title>
    <meta name="description" content="The World's Rarest Bespoke Fragrances. Handcrafted Royal Masterpieces by UB Perfumes.">

    <!-- Ultra-Luxury Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --gold-light: #f3e5ab;
            --bg-deep: #010101;
            --card-surface: #0a0a0c;
            --border-gold: rgba(212, 175, 55, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-deep);
            color: #f5f5f5; 
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% -10%, rgba(212, 175, 55, 0.15) 0%, transparent 50%);
        }

        header { 
            text-align: center; 
            padding: 45px 20px 25px 20px; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            background: #020202;
            position: relative;
        }

        .brand-title { 
            font-family: 'Cinzel', serif; 
            font-size: 30px; 
            letter-spacing: 8px; 
            font-weight: 900; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 15px rgba(212, 175, 55, 0.4));
        }

        .brand-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            letter-spacing: 5px;
            color: #999;
            text-transform: uppercase;
            font-weight: 500;
        }

        .wrapper {
            max-width: 460px;
            margin: 0 auto;
            padding: 25px 14px 60px 14px;
        }

        /* Royal Slider Stage */
        .slider-stage {
            width: 100%;
            margin-bottom: 35px;
            border-radius: 18px;
            padding: 1px;
            background: var(--gold-gradient);
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
        }

        .slider-inner {
            width: 100%;
            height: 260px;
            background: #050505;
            border-radius: 17px;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .slide.active { opacity: 1; z-index: 1; }

        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 25px 20px 15px 20px;
            background: linear-gradient(to top, rgba(2,2,2,0.95), transparent);
        }

        .slide-title {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
        }

        /* Section Heading */
        .section-header {
            text-align: center;
            margin: 30px 0 20px 0;
        }

        .section-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 4px;
            color: var(--gold-light);
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Fixed Grid to Prevent Overflow */
        .container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            width: 100%;
        }
        
        .perfume-card { 
            background: var(--card-surface); 
            border: 1px solid var(--border-gold); 
            border-radius: 16px; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            overflow: hidden; /* Ensures contents stay strictly inside */
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .perfume-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold-solid);
        }

        .image-container { 
            width: 100%; 
            padding-top: 100%; 
            position: relative; 
            overflow: hidden; 
            border-radius: 10px; 
            margin-bottom: 10px; 
            background: #000;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .product-img { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            transition: transform 0.6s ease;
        }

        .perfume-card:hover .product-img {
            transform: scale(1.08);
        }

        .perfume-title {
            font-family: 'Cinzel', serif; 
            font-size: 12px; 
            margin-bottom: 6px; 
            font-weight: 700; 
            color: #fff; 
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .perfume-price-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .perfume-price {
            font-family: 'Cinzel', serif;
            font-size: 15px; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .perfume-volume {
            font-size: 7px;
            color: #777;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Clean & Direct WhatsApp Order Button */
        .btn { 
            display: block; 
            background: var(--gold-gradient); 
            color: #030303; 
            text-align: center; 
            padding: 10px 4px; 
            border-radius: 25px; 
            text-decoration: none; 
            font-size: 8.5px; 
            font-weight: 900; 
            margin-top: auto; 
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: opacity 0.2s ease;
        }

        .btn:active { opacity: 0.8; }
        
        .perfume-card.out-of-stock .product-img { filter: grayscale(100%); opacity: 0.3; }
        .btn-out { 
            background: #0d0d0f; 
            border: 1px solid #222;
            color: #444; 
            cursor: not-allowed; 
            text-align: center; 
            padding: 10px 4px; 
            border-radius: 25px; 
            font-size: 8.5px; 
            margin-top: auto; 
            font-weight: 700; 
            letter-spacing: 1px;
        }

        .stock-tag { 
            position: absolute; 
            top: 14px; left: 14px; 
            background: rgba(180, 20, 20, 0.9); 
            color: white; 
            padding: 3px 6px; 
            font-size: 7px; 
            border-radius: 4px; 
            font-weight: bold; 
            z-index: 2; 
            letter-spacing: 1px;
        }

        .loading { 
            text-align: center; 
            grid-column: span 2; 
            font-family: 'Cinzel', serif;
            font-size: 11px; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 35px; 
            letter-spacing: 2px; 
            font-weight: 700;
        }

        footer {
            margin-top: 50px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 25px;
        }

        .footer-text {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .footer-sub {
            font-size: 8px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">UB Perfumes</div>
        <div class="brand-subtitle">Haute Parfumerie Royale</div>
    </header>

    <div class="wrapper">
        <div class="slider-stage">
            <div class="slider-inner">
                <div class="slide active">
                    <img class="slide-img" src="https://i.postimg.cc/Gm6NLs43/1784547021297.png" alt="Royal Kasturi">
                    <div class="slide-overlay">
                        <div class="slide-title">Royal Kasturi</div>
                    </div>
                </div>
                <div class="slide">
                    <img class="slide-img" src="https://i.postimg.cc/rmnw3h5j/1785151122893.png" alt="Chocolate Fragrance">
                    <div class="slide-overlay">
                        <div class="slide-title">Chocolate Essence</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section-header">
            <h2>SUMMONING PRIVATE COLLECTION</h2>
        </div>

        <div class="container" id="perfume-list">
            <div class="loading">LOADING PRIVATE VAULT...</div>
        </div>

        <footer>
            <div class="footer-text">UB Perfumes Gujarat</div>
            <div class="footer-sub">Handcrafted Bespoke Essences</div>
        </footer>
    </div>

    <script>
        const SHEET_ID = '13rNvj9LgIuMGplhhNrScH8I8cwguZ5inDTzGphm1EqY'; 
        const WHATSAPP_NUMBER = '919898647697'; 

        // Banner Slider Animation
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 4000);

        // Lightning-Fast Google Sheet Data Render
        window.renderPerfumes = function(data) {
            const container = document.getElementById('perfume-list');
            container.innerHTML = '';

            if (!data || !data.table || !data.table.rows || data.table.rows.length === 0) {
                container.innerHTML = '<div class="loading">COLLECTION CURRENTLY UNAVAILABLE</div>';
                return;
            }

            data.table.rows.forEach((row) => {
                const cols = row.c;
                if (!cols || !cols[0] || !cols[0].v) return;

                const name = cols[0] ? String(cols[0].v).trim() : '';
                const price = cols[1] && cols[1].v !== null ? String(cols[1].v).trim() : '';
                const img = cols[3] && cols[3].v ? String(cols[3].v).trim() : 'https://via.placeholder.com/200';
                const stockStatus = cols[4] && cols[4].v ? String(cols[4].v).trim().toLowerCase() : '';
                
                const isOutOfStock = stockStatus.includes('out');
                if (!name) return;

                let actionButton = `<a href="https://wa.me/${WHATSAPP_NUMBER}?text=Pranam UB Perfumes, I wish to order: ${encodeURIComponent(name)}" target="_blank" class="btn">ORDER VIA WHATSAPP</a>`;
                let badge = '';
                let cardClass = 'perfume-card';

                if (isOutOfStock) {
                    actionButton = `<div class="btn-out">SOLD OUT</div>`;
                    badge = `<div class="stock-tag">RESERVED</div>`;
                    cardClass = 'perfume-card out-of-stock';
                }

                container.innerHTML += `
                    <div class="${cardClass}">
                        ${badge}
                        <div class="image-container"><img class="product-img" src="${img}" alt="${name}"></div>
                        <div class="perfume-title">${name}</div>
                        <div class="perfume-price-row">
                            <span class="perfume-price">₹ ${price}</span>
                            <span class="perfume-volume">ATTAR</span>
                        </div>
                        ${actionButton}
                    </div>
                `;
            });
        };

        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:renderPerfumes`;
        script.onerror = function() {
            document.getElementById('perfume-list').innerHTML = '<div class="loading">UNABLE TO REACH PRIVATE VAULT</div>';
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
