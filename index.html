<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- गूगल साइट वेरिफिकेशन टैग -->
    <meta name="google-site-verification" content="K3TaRCvOiyp29o8nM_OL7_dqZcPhPGoSS_iiDNVADkw" />

    <!-- SEO -->
    <title>UB PERFUMES — Haute Parfumerie Royale</title>
    <meta name="description" content="The World's Rarest Bespoke Fragrances. Handcrafted Royal Masterpieces by UB Perfumes.">

    <!-- Luxury Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #fff2a3 25%, #aa771c 50%, #fcf6ba 75%, #8d6219 100%);
            --gold-solid: #d4af37;
            --gold-light: #f3e5ab;
            --bg-deep: #050507;
            --card-surface: #0c0c0f;
            --border-gold: rgba(212, 175, 55, 0.25);
            --border-gold-hover: rgba(212, 175, 55, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-deep);
            color: #e5e5e5; 
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(212, 175, 55, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(170, 119, 28, 0.08) 0%, transparent 50%);
        }

        header { 
            text-align: center; 
            padding: 50px 20px 30px 20px; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            background: linear-gradient(to bottom, #030304, #08080a);
            position: relative;
        }

        .brand-title { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 34px; 
            letter-spacing: 10px; 
            font-weight: 700; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 6px;
            filter: drop-shadow(0 2px 10px rgba(212, 175, 55, 0.3));
        }

        .brand-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 9px;
            letter-spacing: 6px;
            color: #888;
            text-transform: uppercase;
            font-weight: 400;
        }

        .wrapper {
            max-width: 480px;
            margin: 0 auto;
            padding: 30px 14px 70px 14px;
        }

        /* --- Roja & Clive Christian Style High-End Crystal Slider --- */
        .slider-stage {
            width: 100%;
            margin-bottom: 40px;
            border-radius: 18px;
            padding: 1.5px;
            background: var(--gold-gradient);
            box-shadow: 0 40px 80px rgba(0,0,0,0.99), 0 0 35px rgba(212, 175, 55, 0.2);
            position: relative;
        }

        .slider-inner {
            width: 100%;
            height: 340px;
            background: radial-gradient(circle at 50% 40%, #16161c 0%, #060608 100%);
            border-radius: 17px;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.8s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 20px 15px 20px;
        }

        .slide.active { 
            opacity: 1; 
            visibility: visible; 
            z-index: 1; 
        }

        /* 100% Crystal Clear Image Container - Zero Blur, Zero Crop */
        .slide-img-box {
            width: 100%;
            height: 225px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slide-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.95));
            transform: scale(0.95);
            transition: transform 6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide.active .slide-img {
            transform: scale(1.02);
        }

        /* Separate Floating Glassmorphism Caption Box (No overlapping blur on image) */
        .slide-caption {
            width: 100%;
            background: rgba(12, 12, 16, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            padding: 10px 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            margin-top: auto;
        }

        .slide-tag {
            font-size: 6.5px;
            letter-spacing: 3.5px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 2px;
            font-weight: 500;
        }

        .slide-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            font-weight: 600;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        /* Slider Indicators */
        .slider-dots {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.4s ease;
        }

        .dot.active {
            width: 16px;
            border-radius: 4px;
            background: var(--gold-solid);
            box-shadow: 0 0 8px var(--gold-solid);
        }

        /* Section Title Styling */
        .section-header {
            text-align: center;
            margin: 35px 0 25px 0;
            position: relative;
        }

        .section-header h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 14px;
            letter-spacing: 5px;
            color: var(--gold-light);
            text-transform: uppercase;
            font-weight: 600;
        }

        .section-header::after {
            content: '';
            display: block;
            width: 40px;
            height: 1px;
            background: var(--gold-solid);
            margin: 8px auto 0 auto;
            opacity: 0.5;
        }

        /* Strict Grid Layout */
        .container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 14px; 
            width: 100%;
        }
        
        .perfume-card { 
            background: var(--card-surface); 
            border: 1px solid var(--border-gold); 
            border-radius: 14px; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.85);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .perfume-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-gold-hover);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.12);
        }

        .image-container { 
            width: 100%; 
            padding-top: 100%; 
            position: relative; 
            overflow: hidden; 
            border-radius: 10px; 
            margin-bottom: 12px; 
            background: #000;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .product-img { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .perfume-card:hover .product-img {
            transform: scale(1.08);
        }

        .perfume-title {
            font-family: 'Cormorant Garamond', serif; 
            font-size: 14px; 
            margin-bottom: 6px; 
            font-weight: 600; 
            color: #fff; 
            letter-spacing: 0.8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .perfume-price-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .perfume-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .perfume-volume {
            font-size: 7px;
            color: #888;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Ultra-Luxury Order Button */
        .btn { 
            display: block; 
            background: var(--gold-gradient); 
            color: #030304; 
            text-align: center; 
            padding: 10px 4px; 
            border-radius: 20px; 
            text-decoration: none; 
            font-size: 8px; 
            font-weight: 700; 
            margin-top: auto; 
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
            transition: all 0.3s ease;
        }

        .btn:hover {
            filter: brightness(1.1);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .btn:active { transform: scale(0.98); }
        
        .perfume-card.out-of-stock .product-img { filter: grayscale(100%) brightness(0.4); }
        .btn-out { 
            background: #09090b; 
            border: 1px solid rgba(255,255,255,0.08);
            color: #555; 
            cursor: not-allowed; 
            text-align: center; 
            padding: 10px 4px; 
            border-radius: 20px; 
            font-size: 8px; 
            margin-top: auto; 
            font-weight: 600; 
            letter-spacing: 1.5px;
        }

        .stock-tag { 
            position: absolute; 
            top: 14px; left: 14px; 
            background: rgba(140, 20, 20, 0.9); 
            color: white; 
            padding: 3px 7px; 
            font-size: 7px; 
            border-radius: 4px; 
            font-weight: 600; 
            z-index: 2; 
            letter-spacing: 1.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .loading { 
            text-align: center; 
            grid-column: span 2; 
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 40px; 
            letter-spacing: 3px; 
            font-weight: 600;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            padding-top: 30px;
        }

        .footer-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 12px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .footer-sub {
            font-size: 7.5px;
            color: #666;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">UB Perfumes</div>
        <div class="brand-subtitle">Haute Parfumerie Royale</div>
    </header>

    <div class="wrapper">
        <!-- Crystal Clear High-End Luxury Slider -->
        <div class="slider-stage">
            <div class="slider-inner" id="slider-container">
                <div class="slide active">
                    <div class="slide-img-box">
                        <img class="slide-img" src="https://i.postimg.cc/Gm6NLs43/1784547021297.png" alt="Royal Kasturi">
                    </div>
                    <div class="slide-caption">
                        <div class="slide-tag">Featured Masterpiece</div>
                        <div class="slide-title">Royal Kasturi Essence</div>
                    </div>
                </div>
                <div class="slide">
                    <div class="slide-img-box">
                        <img class="slide-img" src="https://i.postimg.cc/rmnw3h5j/1785151122893.png" alt="Chocolate Fragrance">
                    </div>
                    <div class="slide-caption">
                        <div class="slide-tag">Private Creation</div>
                        <div class="slide-title">Artisan Chocolate</div>
                    </div>
                </div>
                
                <!-- Indicators -->
                <div class="slider-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>

        <div class="section-header">
            <h2>The Private Vault</h2>
        </div>

        <div class="container" id="perfume-list">
            <div class="loading">ENTERING PRIVATE VAULT...</div>
        </div>

        <footer>
            <div class="footer-text">UB Perfumes Gujarat</div>
            <div class="footer-sub">Handcrafted Bespoke Masterpieces</div>
        </footer>
    </div>

    <script>
        const SHEET_ID = '13rNvj9LgIuMGplhhNrScH8I8cwguZ5inDTzGphm1EqY'; 
        const WHATSAPP_NUMBER = '919898647697'; 

        // Smooth Slider Engine
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        let currentSlide = 0;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');
            
            currentSlide = (currentSlide + 1) % slides.length;
            
            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }

        setInterval(nextSlide, 5000);

        // Lightning-Fast Google Sheet Data Render
        window.renderPerfumes = function(data) {
            const container = document.getElementById('perfume-list');
            container.innerHTML = '';

            if (!data || !data.table || !data.table.rows || data.table.rows.length === 0) {
                container.innerHTML = '<div class="loading">COLLECTION TEMPORARILY SEALED</div>';
                return;
            }

            data.table.rows.forEach((row) => {
                const cols = row.c;
                if (!cols || !cols[0] || !cols[0].v) return;

                const name = cols[0] ? String(cols[0].v).trim() : '';
                const price = cols[1] && cols[1].v !== null ? String(cols[1].v).trim() : '';
                const img = cols[3] && cols[3].v ? String(cols[3].v).trim() : 'https://via.placeholder.com/200';
                const stockStatus = cols[4] && cols[4].v ? String(cols[4].v).trim().toLowerCase() : '';
                
                const isOutOfStock = stockStatus.includes('out');
                if (!name) return;

                let actionButton = `<a href="https://wa.me/${WHATSAPP_NUMBER}?text=I wish to order: ${encodeURIComponent(name)}" target="_blank" class="btn">ORDER VIA WHATSAPP</a>`;
                let badge = '';
                let cardClass = 'perfume-card';

                if (isOutOfStock) {
                    actionButton = `<div class="btn-out">RESERVED</div>`;
                    badge = `<div class="stock-tag">SOLD OUT</div>`;
                    cardClass = 'perfume-card out-of-stock';
                }

                container.innerHTML += `
                    <div class="${cardClass}">
                        ${badge}
                        <div class="image-container"><img class="product-img" src="${img}" alt="${name}"></div>
                        <div class="perfume-title">${name}</div>
                        <div class="perfume-price-row">
                            <span class="perfume-price">₹ ${price}</span>
                            <span class="perfume-volume">SPRAY PERFUME</span>
                        </div>
                        ${actionButton}
                    </div>
                `;
            });
        };

        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:renderPerfumes`;
        script.onerror = function() {
            document.getElementById('perfume-list').innerHTML = '<div class="loading">UNABLE TO REACH PRIVATE VAULT</div>';
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
