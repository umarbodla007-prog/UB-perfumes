<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>UB PERFUMES — Haute Parfumerie Royale</title>
    
    <!-- Luxury Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #c5a059 0%, #dfbf7f 30%, #b89742 70%, #856119 100%);
            --gold-solid: #b89742;
            --gold-light: #fcfbfa;
            --bg-deep: #ffffff;
            --card-surface: #ffffff;
            --border-gold: rgba(184, 151, 66, 0.25);
            --border-gold-hover: rgba(184, 151, 66, 0.9);
            --text-main: #1a1a1a;
            --text-muted: #777777;
            --header-bg: #ffffff;
            --festival-glow: rgba(184, 151, 66, 0.15);
        }

        body.vibe-saudi {
            --gold-gradient: linear-gradient(135deg, #006C35 0%, #009e4f 35%, #D4AF37 75%, #004225 100%);
            --gold-solid: #006C35;
            --border-gold: rgba(0, 108, 53, 0.35);
            --border-gold-hover: rgba(0, 108, 53, 0.9);
            --festival-glow: rgba(0, 108, 53, 0.2);
            --header-bg: linear-gradient(to bottom, #ffffff, #f0fdf4);
        }

        body.vibe-diwali {
            --gold-gradient: linear-gradient(135deg, #e65c00 0%, #F9D423 50%, #FF4E50 100%);
            --gold-solid: #e65c00;
            --border-gold: rgba(230, 92, 0, 0.35);
            --border-gold-hover: rgba(230, 92, 0, 0.9);
            --festival-glow: rgba(230, 92, 0, 0.2);
            --header-bg: linear-gradient(to bottom, #ffffff, #fffaf5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-deep);
            color: var(--text-main); 
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.6s ease;
        }

        header { 
            text-align: center; 
            padding: 40px 20px 25px 20px; 
            border-bottom: 1px solid var(--border-gold);
            background: var(--header-bg);
            position: relative;
        }

        #dynamic-banner {
            display: none;
            background: var(--gold-gradient);
            color: #ffffff;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            padding: 12px 20px;
            font-weight: 700;
            margin-bottom: 20px;
            border-radius: 6px;
            box-shadow: 0 8px 25px var(--festival-glow);
            text-align: center;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .brand-title { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 40px; 
            letter-spacing: 12px; 
            font-weight: 700; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .brand-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 9px;
            letter-spacing: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 500;
        }

        .search-container {
            max-width: 500px;
            margin: 25px auto 0 auto;
            padding: 0 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 22px;
            border: 1px solid var(--border-gold);
            border-radius: 30px;
            background: #faf9f5;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
            outline: none;
            color: var(--text-main);
            box-shadow: 0 4px 15px var(--festival-glow);
        }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px 20px;
        }

        .slider-stage {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 50px auto;
            border-radius: 16px;
            padding: 1.5px;
            background: var(--gold-gradient);
            box-shadow: 0 20px 40px var(--festival-glow);
        }

        .slider-inner {
            width: 100%;
            height: 380px;
            background: #ffffff;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .slide.active { opacity: 1; visibility: visible; z-index: 1; }
        .slide-img-frame { width: 100%; height: 280px; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .slide-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .slide-caption { width: 100%; padding: 12px 15px; background: var(--gold-light); border-top: 1px solid var(--border-gold); text-align: center; }
        .slide-title { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: #1a1a1a; letter-spacing: 2px; }

        .section-header { text-align: center; margin: 40px 0 30px 0; position: relative; }
        .section-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 16px; letter-spacing: 6px; color: var(--gold-solid); text-transform: uppercase; font-weight: 600; }
        .section-header::after { content: ''; display: block; width: 60px; height: 1.5px; background: var(--gold-solid); margin: 10px auto 0 auto; opacity: 0.5; }

        .container { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 25px; 
            width: 100%; 
        }
        
        .perfume-card { 
            background: var(--card-surface); 
            border: 1px solid var(--border-gold); 
            border-radius: 16px; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            box-shadow: 0 10px 30px var(--festival-glow);
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .image-container { width: 100%; padding-top: 100%; position: relative; overflow: hidden; border-radius: 12px; margin-bottom: 14px; background: #ffffff; border: 1px solid rgba(0,0,0,0.03); }
        .product-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }

        .perfume-title { font-family: 'Cormorant Garamond', serif; font-size: 16px; margin-bottom: 8px; font-weight: 600; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .perfume-price-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 15px; }
        .price-box { display: flex; align-items: baseline; gap: 8px; }
        .perfume-price { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--gold-solid); font-weight: 700; }
        .original-price { font-size: 10px; color: #999; text-decoration: line-through; }
        .perfume-volume { font-size: 8px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; }

        .btn { 
            display: block; 
            background: var(--gold-gradient); 
            color: #ffffff; 
            text-align: center; 
            padding: 11px 6px; 
            border-radius: 25px; 
            text-decoration: none; 
            font-size: 9px; 
            font-weight: 700; 
            margin-top: auto; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .festival-badge {
            position: absolute; top: 16px; right: 16px;
            background: var(--gold-gradient);
            color: white; padding: 5px 10px; font-size: 7px; border-radius: 4px; font-weight: 700; z-index: 2; text-transform: uppercase;
        }

        #product-detail-view { display: none; max-width: 900px; margin: 0 auto; }
        .back-btn { background: none; border: 1px solid var(--gold-solid); color: var(--gold-solid); padding: 10px 20px; border-radius: 25px; font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; margin-bottom: 30px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
        
        /* 🖼️ Swipeable / Touch Slider Container for Detail Images */
        .detail-slider-wrapper {
            width: 100%;
            position: relative;
            border-radius: 16px;
            border: 1px solid var(--border-gold);
            background: #fff;
            box-shadow: 0 15px 35px var(--festival-glow);
            margin-bottom: 15px;
            overflow: hidden;
        }
        .detail-slider-track {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Hide scrollbar for clean look */
        }
        .detail-slider-track::-webkit-scrollbar { display: none; }
        
        .detail-slide-item {
            min-width: 100%;
            height: 380px;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            flex-shrink: 0;
        }
        .detail-main-img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* 🔘 Dots for Swipe / Slide indicators */
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(184, 151, 66, 0.3);
            cursor: pointer; transition: 0.3s;
        }
        .dot.active { background: var(--gold-solid); transform: scale(1.2); }

        .detail-thumbnails { display: flex; gap: 12px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 5px; }
        .thumb-img { width: 75px; height: 75px; border-radius: 10px; border: 1px solid var(--border-gold); object-fit: cover; cursor: pointer; opacity: 0.6; background: #fff; }
        .thumb-img.active { opacity: 1; border-color: var(--gold-solid); }
        
        .detail-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; }
        .detail-price { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--gold-solid); font-weight: 700; }
        .detail-desc-title { font-size: 11px; letter-spacing: 3px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
        .detail-desc-text { font-size: 13px; line-height: 1.9; color: #444; margin-bottom: 35px; background: #faf9f5; padding: 20px; border-radius: 12px; border-left: 3px solid var(--gold-solid); }

        footer { margin-top: 80px; text-align: center; border-top: 1px solid var(--border-gold); padding-top: 40px; }
        .footer-text { font-family: 'Cormorant Garamond', serif; font-size: 14px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 6px; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }

        @media (max-width: 768px) {
            .container { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .detail-grid { grid-template-columns: 1fr; gap: 20px; }
            .brand-title { font-size: 28px; letter-spacing: 8px; }
            .wrapper { padding: 20px 14px 60px 14px; }
            .detail-slide-item { height: 260px; }
        }
    </style>
</head>
<body>
    <header>
        <div id="dynamic-banner">✨ Special Collection Active ✨</div>
        <div class="brand-title" onclick="goHome()">UB Perfumes</div>
        <div class="brand-subtitle">Haute Parfumerie Royale</div>
    </header>

    <div class="search-container" id="search-section">
        <input type="text" id="searchInput" class="search-input" placeholder="Search rare fragrances..." onkeyup="filterPerfumes()">
    </div>

    <div class="wrapper">
        <div id="home-view">
            <div class="slider-stage">
                <div class="slider-inner" id="slider-container">
                    <div class="slide active">
                        <div class="slide-img-frame"><img class="slide-img" src="https://i.postimg.cc/Gm6NLs43/1784547021297.png" alt="Royal Kasturi" onerror="this.src='https://via.placeholder.com/200?text=UB+Perfumes'"></div>
                        <div class="slide-caption"><div class="slide-title">Royal Kasturi Essence</div></div>
                    </div>
                </div>
            </div>

            <div class="section-header"><h2>The Private Vault</h2></div>
            <div class="container" id="perfume-list">
                <div style="text-align:center; grid-column:span 4; padding:50px; font-family:'Cormorant Garamond'; color:#b89742; font-size:16px;">ENTERING PRIVATE VAULT...</div>
            </div>
        </div>

        <div id="product-detail-view">
            <button class="back-btn" onclick="goHome()">← Back to Vault</button>
            <div class="detail-grid">
                <div>
                    <!-- Swipeable Track for Images -->
                    <div class="detail-slider-wrapper">
                        <div class="detail-slider-track" id="detailSliderTrack" onscroll="updateActiveDot()">
                            <!-- Images will load here -->
                        </div>
                    </div>
                    <!-- Slide Indicator Dots -->
                    <div class="slider-dots" id="sliderDots"></div>
                    <!-- Thumbnails -->
                    <div class="detail-thumbnails" id="thumbnailContainer"></div>
                </div>
                <div id="detailInfo"></div>
            </div>
        </div>

        <footer>
            <div class="footer-text">UB Perfumes Gujarat</div>
            <div style="font-size:8px; color:#999; letter-spacing:3px;">Handcrafted Bespoke Masterpieces</div>
        </footer>
    </div>

    <script>
        const SHEET_ID = '13rNvj9LgIuMGplhhNrScH8I8cwguZ5inDTzGphm1EqY'; 
        const WHATSAPP_NUMBER = '919898647697'; 
        let allProducts = [];

        window.renderPerfumes = function(data) {
            const container = document.getElementById('perfume-list');
            container.innerHTML = '';
            allProducts = [];
            let activeFestival = '';

            if (data && data.table && data.table.rows) {
                data.table.rows.forEach((row, index) => {
                    const cols = row.c;
                    if (!cols || !cols[0] || !cols[0].v) return;

                    const item = {
                        id: index,
                        name: cols[0] ? String(cols[0].v).trim() : '',
                        regPrice: cols[1] && cols[1].v ? String(cols[1].v).trim() : '',
                        img: cols[3] && cols[3].v ? String(cols[3].v).trim() : 'https://via.placeholder.com/200',
                        offerPrice: (cols.length > 5 && cols[5] && cols[5].v) ? String(cols[5].v).trim() : '',
                        festival: (cols.length > 6 && cols[6] && cols[6].v) ? String(cols[6].v).trim() : '',
                        desc: (cols.length > 7 && cols[7] && cols[7].v) ? String(cols[7].v).trim() : 'Crafted with the rarest botanical essences, this royal bespoke fragrance delivers an unmatched aura of luxury and sophistication.',
                        extra1: (cols.length > 8 && cols[8] && cols[8].v) ? String(cols[8].v).trim() : '',
                        extra2: (cols.length > 9 && cols[9] && cols[9].v) ? String(cols[9].v).trim() : '',
                        extra3: (cols.length > 10 && cols[10] && cols[10].v) ? String(cols[10].v).trim() : ''
                    };

                    allProducts.push(item);
                    if (item.festival && !activeFestival) activeFestival = item.festival;
                });
            }

            displayProducts(allProducts);

            if (activeFestival) {
                const banner = document.getElementById('dynamic-banner');
                banner.style.display = 'block';
                const festLower = activeFestival.toLowerCase();
                if (festLower.includes('saudi') || festLower.includes('national day')) {
                    document.body.classList.add('vibe-saudi');
                    banner.innerHTML = `🇸🇦 Official ${activeFestival} Celebration Collection & Offers 🇸🇦`;
                } else if (festLower.includes('diwali')) {
                    document.body.classList.add('vibe-diwali');
                    banner.innerHTML = `🪔 Exclusive ${activeFestival} Royal Festive Sale 🪔`;
                } else {
                    banner.innerHTML = `🌟 Special ${activeFestival} Collection & Offers Live 🌟`;
                }
            }
        };

        function displayProducts(products) {
            const container = document.getElementById('perfume-list');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = '<div style="text-align:center; grid-column:span 4; padding:40px; color:#777; font-size:12px;">No rare fragrances found.</div>';
                return;
            }

            products.forEach((item) => {
                let priceHtml = `<span class="perfume-price">₹ ${item.regPrice}</span>`;
                if (item.offerPrice) {
                    priceHtml = `<div class="price-box"><span class="perfume-price">₹ ${item.offerPrice}</span><span class="original-price">₹ ${item.regPrice}</span></div>`;
                }
                let festivalBadge = item.festival ? `<div class="festival-badge">${item.festival}</div>` : '';

                container.innerHTML += `
                    <div class="perfume-card" onclick="openDetail(${item.id})">
                        ${festivalBadge}
                        <div class="image-container">
                            <img class="product-img" src="${item.img}" alt="${item.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/200?text=UB+Perfumes';">
                        </div>
                        <div class="perfume-title">${item.name}</div>
                        <div class="perfume-price-row">
                            ${priceHtml}
                            <span class="perfume-volume">SPRAY</span>
                        </div>
                        <div class="btn">VIEW MASTERPIECE</div>
                    </div>
                `;
            });
        }

        function filterPerfumes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filtered);
        }

        function openDetail(id) {
            const item = allProducts.find(p => p.id === id);
            if (!item) return;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('search-section').style.display = 'none';
            document.getElementById('product-detail-view').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            let imgList = [item.img];
            if (item.extra1) imgList.push(item.extra1);
            if (item.extra2) imgList.push(item.extra2);
            if (item.extra3) imgList.push(item.extra3);

            // Render Slider Track Images
            const track = document.getElementById('detailSliderTrack');
            const dotsContainer = document.getElementById('sliderDots');
            const thumbContainer = document.getElementById('thumbnailContainer');
            
            track.innerHTML = '';
            dotsContainer.innerHTML = '';
            thumbContainer.innerHTML = '';

            imgList.forEach((url, idx) => {
                track.innerHTML += `
                    <div class="detail-slide-item">
                        <img class="detail-main-img" src="${url}" alt="Detail" onerror="this.onerror=null; this.src='https://via.placeholder.com/400?text=UB+Perfumes';">
                    </div>
                `;

                dotsContainer.innerHTML += `<div class="dot ${idx === 0 ? 'active' : ''}" onclick="scrollToSlide(${idx})"></div>`;

                thumbContainer.innerHTML += `
                    <img class="thumb-img ${idx === 0 ? 'active' : ''}" src="${url}" onclick="scrollToSlide(${idx})" alt="Thumb" onerror="this.onerror=null; this.src='https://via.placeholder.com/100?text=UB';">
                `;
            });

            let priceHtml = `<span class="detail-price">₹ ${item.regPrice}</span>`;
            if (item.offerPrice) {
                priceHtml = `<div style="display:flex; align-items:baseline; gap:12px;"><span class="detail-price">₹ ${item.offerPrice}</span><span style="font-size:14px; color:#999; text-decoration:line-through;">₹ ${item.regPrice}</span></div>`;
            }

            document.getElementById('detailInfo').innerHTML = `
                <div class="detail-title">${item.name}</div>
                <div class="detail-price-box">${priceHtml}</div>
                <div class="detail-desc-title">Olfactory Notes & Description</div>
                <div class="detail-desc-text">${item.desc}</div>
                <a href="https://wa.me/${WHATSAPP_NUMBER}?text=I%20wish%20to%20order:%20${encodeURIComponent(item.name)}" target="_blank" class="btn" style="padding:15px; font-size:11px; border-radius:30px; text-align:center;">ORDER VIA WHATSAPP</a>
            `;
        }

        // 📱 Touch / Click Slide functions
        function scrollToSlide(index) {
            const track = document.getElementById('detailSliderTrack');
            const slideWidth = track.clientWidth;
            track.scrollTo({ left: slideWidth * index, behavior: 'smooth' });
            updateActiveThumbAndDot(index);
        }

        function updateActiveDot() {
            const track = document.getElementById('detailSliderTrack');
            const slideWidth = track.clientWidth;
            const scrollLeft = track.scrollLeft;
            const index = Math.round(scrollLeft / slideWidth);
            updateActiveThumbAndDot(index);
        }

        function updateActiveThumbAndDot(index) {
            const dots = document.querySelectorAll('.dot');
            const thumbs = document.querySelectorAll('.thumb-img');

            dots.forEach((d, i) => d.classList.toggle('active', i === index));
            thumbs.forEach((t, i) => t.classList.toggle('active', i === index));
        }

        function goHome() {
            document.getElementById('product-detail-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('search-section').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:renderPerfumes`;
        document.body.appendChild(script);
    </script>
</body>
</html>
