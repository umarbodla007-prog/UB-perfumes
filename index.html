<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- गूगल साइट वेरिफिकेशन टैग -->
    <meta name="google-site-verification" content="K3TaRCvOiyp29o8nM_OL7_dqZcPhPGoSS_iiDNVADkw" />

    <!-- गूगल खोज (SEO) सेटिंग्स -->
    <title>UB PERFUMES — 10 Lakh X Haute Parfumerie Royale</title>
    <meta name="description" content="The pinnacle of bespoke royal fragrances. UB Perfumes Private Collection. Handcrafted artisanal masterpieces.">
    <meta name="robots" content="index, follow">

    <!-- Millionaire Luxury Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --pure-gold: #f9f1d0;
            --liquid-gold-1: #bf953f;
            --liquid-gold-2: #fcf6ba;
            --liquid-gold-3: #b38728;
            --liquid-gold-4: #aa771c;
            --royal-gradient: linear-gradient(135deg, var(--liquid-gold-1) 0%, var(--liquid-gold-2) 25%, var(--liquid-gold-3) 50%, var(--liquid-gold-4) 100%);
            --bg-void: #010101;
            --card-royal: rgba(10, 10, 12, 0.9);
            --border-royal-gold: rgba(212, 175, 55, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-void);
            background-image: 
                radial-gradient(circle at 50% -5%, rgba(212, 175, 55, 0.28) 0%, transparent 50%),
                radial-gradient(circle at 50% 105%, rgba(160, 110, 20, 0.15) 0%, transparent 45%);
            color: #f5f5f5; 
            padding: 0;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 24K Gold Dust Canvas */
        #million-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.85;
        }

        header { 
            text-align: center; 
            padding: 45px 20px 20px 20px; 
            position: relative;
            z-index: 2;
        }

        .brand-title { 
            font-family: 'Cinzel Decorative', serif; 
            font-size: 34px; 
            letter-spacing: 9px; 
            font-weight: 900; 
            background: var(--royal-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            filter: drop-shadow(0 5px 20px rgba(212, 175, 55, 0.6));
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 14px;
            letter-spacing: 7px;
            color: #e2c98a;
            text-transform: uppercase;
            font-style: italic;
            font-weight: 700;
        }

        .royal-crest {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin: 18px auto 0 auto;
            max-width: 260px;
        }

        .crest-line {
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, transparent, var(--liquid-gold-1), transparent);
        }

        .crest-gem {
            width: 7px;
            height: 7px;
            background: var(--liquid-gold-2);
            transform: rotate(45deg);
            box-shadow: 0 0 12px var(--pure-gold);
        }

        .wrapper {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 16px 60px 16px;
            position: relative;
            z-index: 2;
        }

        /* Millionaire Hero Slider */
        .slider-stage {
            width: 100%;
            margin: 15px 0 35px 0;
            position: relative;
            border-radius: 28px;
            padding: 2px;
            background: var(--royal-gradient);
            box-shadow: 0 35px 70px rgba(0,0,0,0.98), 0 0 45px rgba(212, 175, 55, 0.45);
            overflow: hidden;
        }

        .slider-inner {
            width: 100%;
            height: 290px;
            background: #000;
            border-radius: 26px;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
            transform: scale(1.08);
        }

        .slide.active { opacity: 1; transform: scale(1); z-index: 1; }

        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 35px 20px 20px 20px;
            background: linear-gradient(to top, rgba(1,1,1,0.99) 0%, rgba(1,1,1,0.5) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 2;
        }

        .slide-badge {
            align-self: flex-start;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--liquid-gold-1);
            color: var(--pure-gold);
            font-size: 8px;
            letter-spacing: 3px;
            padding: 4px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 6px;
            backdrop-filter: blur(8px);
            font-weight: 700;
        }

        .slide-title {
            font-family: 'Cinzel', serif;
            font-size: 21px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.9);
        }

        .dots-container {
            position: absolute;
            bottom: 18px;
            right: 20px;
            display: flex;
            gap: 6px;
            z-index: 4;
        }

        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.4s ease;
        }

        .dot.active {
            width: 28px;
            border-radius: 12px;
            background: var(--royal-gradient);
            box-shadow: 0 0 12px var(--liquid-gold-1);
        }

        /* Section Heading */
        .section-header {
            text-align: center;
            margin: 40px 0 22px 0;
        }

        .section-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            letter-spacing: 6px;
            color: var(--pure-gold);
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        /* Elite Product Grid */
        .container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 16px; 
        }
        
        .perfume-card { 
            background: var(--card-royal); 
            border: 1px solid var(--border-royal-gold); 
            border-radius: 22px; 
            padding: 14px; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            box-shadow: 0 20px 45px rgba(0,0,0,0.99), inset 0 0 25px rgba(255,255,255,0.02);
            backdrop-filter: blur(20px);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .perfume-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 241, 208, 0.9);
            box-shadow: 0 30px 60px rgba(0,0,0,1), 0 0 35px rgba(212, 175, 55, 0.6);
        }

        .image-container { 
            width: 100%; 
            padding-top: 100%; 
            position: relative; 
            overflow: hidden; 
            border-radius: 16px; 
            margin-bottom: 12px; 
            background: #000;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .product-img { 
            position: absolute; 
            top:0; left:0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .perfume-card:hover .product-img {
            transform: scale(1.15);
        }

        .perfume-title {
            font-family: 'Cinzel', serif; 
            font-size: 13px; 
            margin-bottom: 6px; 
            font-weight: 700; 
            color: #fff; 
            letter-spacing: 1px;
        }

        .perfume-price-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .perfume-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px; 
            color: var(--pure-gold); 
            font-weight: 700;
            background: var(--royal-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .perfume-volume {
            font-size: 8px;
            color: #999;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 24K Gold Liquid Button */
        .btn { 
            display: block; 
            background: var(--royal-gradient); 
            color: #020202; 
            text-align: center; 
            padding: 13px 10px; 
            border-radius: 35px; 
            text-decoration: none; 
            font-size: 10px; 
            font-weight: 900; 
            margin-top: auto; 
            letter-spacing: 2.5px;
            text-transform: uppercase;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:active { 
            transform: scale(0.96); 
            box-shadow: 0 3px 12px rgba(212, 175, 55, 0.4);
        }
        
        .perfume-card.out-of-stock .product-img { filter: grayscale(100%); opacity: 0.3; }
        .btn-out { 
            background: #0d0d0f; 
            border: 1px solid #222;
            color: #444; 
            cursor: not-allowed; 
            text-align: center; 
            padding: 13px 10px; 
            border-radius: 35px; 
            font-size: 10px; 
            margin-top: auto; 
            font-weight: 700; 
            letter-spacing: 2px;
        }

        .stock-tag { 
            position: absolute; 
            top: 18px; left: 18px; 
            background: rgba(190, 20, 20, 0.92); 
            color: white; 
            padding: 4px 10px; 
            font-size: 8px; 
            border-radius: 20px; 
            font-weight: 700; 
            z-index: 2; 
            letter-spacing: 1.5px;
            backdrop-filter: blur(6px);
        }

        .loading { 
            text-align: center; 
            grid-column: span 2; 
            font-family: 'Cinzel', serif;
            font-size: 13px; 
            color: var(--pure-gold); 
            padding: 40px 20px; 
            letter-spacing: 3px; 
        }

        footer {
            margin-top: 60px;
            text-align: center;
            border-top: 1px solid var(--border-royal-gold);
            padding-top: 30px;
        }

        .footer-text {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            color: var(--pure-gold);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .footer-sub {
            font-size: 9px;
            color: #777;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- 24K Gold Dust Canvas -->
    <canvas id="million-canvas"></canvas>

    <header>
        <div class="brand-title">UB PERFUMES</div>
        <div class="brand-subtitle">Haute Parfumerie Royale</div>
        <div class="royal-crest">
            <div class="crest-line"></div>
            <div class="crest-gem"></div>
            <div class="crest-line"></div>
        </div>
    </header>

    <div class="wrapper">
        <!-- Millionaire Slider -->
        <div class="slider-stage">
            <div class="slider-inner">
                <div class="slide active">
                    <img class="slide-img" src="https://i.postimg.cc/Gm6NLs43/1784547021297.png" alt="Royal Kasturi">
                    <div class="slide-overlay">
                        <span class="slide-badge">Royal Reserve</span>
                        <h2 class="slide-title">Royal Kasturi</h2>
                    </div>
                </div>
                <div class="slide">
                    <img class="slide-img" src="https://i.postimg.cc/rmnw3h5j/1785151122893.png" alt="Chocolate Fragrance">
                    <div class="slide-overlay">
                        <span class="slide-badge">Exclusive Artisanal</span>
                        <h2 class="slide-title">Chocolate Essence</h2>
                    </div>
                </div>

                <div class="dots-container">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <div class="section-header">
            <h2>SUMMONING PRIVATE COLLECTION</h2>
        </div>

        <div class="container" id="perfume-list">
            <div class="loading">Loading Royal Vault...</div>
        </div>

        <footer>
            <div class="footer-text">UB Perfumes Gujarat</div>
            <div class="footer-sub">Handcrafted Bespoke Essences</div>
        </footer>
    </div>

    <script>
        const SHEET_ID = '13rNvj9LgIuMGplhhNrScH8I8cwguZ5inDTzGphm1EqY'; 
        const WHATSAPP_NUMBER = '919898647697'; 

        // 24K Gold Dust Background Effect
        const canvas = document.getElementById('million-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class GoldDust {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.4;
                this.speedY = -(Math.random() * 0.2 + 0.04);
                this.opacity = Math.random() * 0.7 + 0.2;
            }
            update() {
                this.y += this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(249, 241, 208, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new GoldDust());

        function animateGoldDust() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateGoldDust);
        }
        animateGoldDust();

        // Slider Animation
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        let currentSlide = 0;

        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }, 4000);

        // Instant Lightning-Fast Google Sheet Data Render
        window.renderPerfumes = function(data) {
            const container = document.getElementById('perfume-list');
            container.innerHTML = '';

            if (!data || !data.table || !data.table.rows || data.table.rows.length === 0) {
                container.innerHTML = '<div class="loading">COLLECTION CURRENTLY UNAVAILABLE</div>';
                return;
            }

            data.table.rows.forEach((row) => {
                const cols = row.c;
                if (!cols || !cols[0] || !cols[0].v) return;

                const name = cols[0] ? String(cols[0].v).trim() : '';
                const price = cols[1] && cols[1].v !== null ? String(cols[1].v).trim() : '';
                const img = cols[3] && cols[3].v ? String(cols[3].v).trim() : 'https://via.placeholder.com/200';
                const stockStatus = cols[4] && cols[4].v ? String(cols[4].v).trim().toLowerCase() : '';
                
                const isOutOfStock = stockStatus.includes('out');
                if (!name) return;

                let actionButton = `<a href="https://wa.me/${WHATSAPP_NUMBER}?text=Pranam UB Perfumes, I wish to reserve: ${encodeURIComponent(name)}" target="_blank" class="btn">RESERVE VIA WA</a>`;
                let badge = '';
                let cardClass = 'perfume-card';

                if (isOutOfStock) {
                    actionButton = `<div class="btn-out">SOLD OUT</div>`;
                    badge = `<div class="stock-tag">RESERVED</div>`;
                    cardClass = 'perfume-card out-of-stock';
                }

                container.innerHTML += `
                    <div class="${cardClass}">
                        ${badge}
                        <div class="image-container"><img class="product-img" src="${img}" alt="${name}"></div>
                        <div class="perfume-title">${name}</div>
                        <div class="perfume-price-row">
                            <span class="perfume-price">₹ ${price}</span>
                            <span class="perfume-volume">ATTAR</span>
                        </div>
                        ${actionButton}
                    </div>
                `;
            });
        };

        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:renderPerfumes`;
        script.onerror = function() {
            document.getElementById('perfume-list').innerHTML = '<div class="loading">UNABLE TO REACH PRIVATE VAULT</div>';
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
