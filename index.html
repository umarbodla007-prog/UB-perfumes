<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- गूगल साइट वेरिफिकेशन टैग -->
    <meta name="google-site-verification" content="K3TaRCvOiyp29o8nM_OL7_dqZcPhPGoSS_iiDNVADkw" />

    <!-- गूगल खोज (SEO) सेटिंग्स -->
    <title>UB Perfumes - Buy Premium & Luxury Fragrances Online</title>
    <meta name="description" content="Buy premium, long-lasting luxury perfumes online at UB Perfumes. Explore our exclusive collection including Kasturi, Chocolates, Mango Man. Order easily via WhatsApp.">
    <meta name="keywords" content="UB Perfumes, buy perfume online, luxury fragrances, Kasturi, Chocolates, Mango Man">
    <meta name="robots" content="index, follow">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #ffffff; color: #121212; padding: 20px 15px 30px 15px; }
        header { text-align: center; padding-bottom: 20px; margin-bottom: 25px; border-bottom: 1px solid #f2f2f2; }
        h1 { font-size: 24px; letter-spacing: 2px; }

        .container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { border: 1px solid #eee; border-radius: 15px; padding: 10px; display: flex; flex-direction: column; position: relative; }
        .image-container { width: 100%; padding-top: 100%; position: relative; overflow: hidden; border-radius: 10px; margin-bottom: 10px; }
        .product-img { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: cover; }
        
        .btn { display: block; background: #121212; color: #fff; text-align: center; padding: 8px; border-radius: 20px; text-decoration: none; font-size: 12px; margin-top: auto; }
        .card.out-of-stock .product-img { filter: grayscale(84%); opacity: 0.6; }
        .btn-out { background: #e53935; color: #fff; cursor: not-allowed; text-align: center; padding: 8px; border-radius: 20px; font-size: 12px; margin-top: auto; font-weight: bold; }
        .stock-tag { position: absolute; top: 15px; left: 15px; background: #e53935; color: white; padding: 3px 8px; font-size: 10px; border-radius: 5px; font-weight: bold; z-index: 2; }
        .loading { text-align: center; grid-column: span 2; font-size: 14px; color: #666; padding: 20px; }
    </style>
</head>
<body>

    <header><h1>UB PERFUMES</h1></header>

    <div class="container" id="perfume-list">
        <div class="loading">उत्पाद लोड हो रहे हैं...</div>
    </div>

    <script>
        const SHEET_ID = '1-jZ03O0D7cOsk3h7-aKk0hHl_hCg0Ld2-k01-tQ4xVk'; 
        const WHATSAPP_NUMBER = '919898647697'; // अपना WhatsApp नंबर लिखें

        // Google Sheet JSON Feed API
        const sheetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        fetch(sheetUrl)
            .then(res => res.text())
            .then(data => {
                const jsonString = data.substring(47, data.length - 2);
                const json = JSON.parse(jsonString);
                const rows = json.table.rows;
                const container = document.getElementById('perfume-list');
                container.innerHTML = '';

                rows.forEach((row) => {
                    const cols = row.c;
                    if (!cols || !cols[0] || !cols[0].v) return;

                    const name = cols[0] ? String(cols[0].v).trim() : '';
                    const price = cols[1] && cols[1].v !== null ? String(cols[1].v).trim() : '';
                    const img = cols[3] && cols[3].v ? String(cols[3].v).trim() : 'https://via.placeholder.com/200';
                    const stockStatus = cols[4] && cols[4].v ? String(cols[4].v).trim().toLowerCase() : '';
                    
                    const isOutOfStock = stockStatus.includes('out');

                    if (!name) return;

                    let actionButton = `<a href="https://wa.me/${WHATSAPP_NUMBER}?text=मुझे ${encodeURIComponent(name)} चाहिए" target="_blank" class="btn">WhatsApp</a>`;
                    let badge = '';
                    let cardClass = 'card';

                    if (isOutOfStock) {
                        actionButton = `<div class="btn-out">Out of Stock</div>`;
                        badge = `<div class="stock-tag">OUT OF STOCK</div>`;
                        cardClass = 'card out-of-stock';
                    }

                    container.innerHTML += `
                        <div class="${cardClass}">
                            ${badge}
                            <div class="image-container"><img class="product-img" src="${img}" alt="${name}"></div>
                            <h3 style="font-size:14px; margin-bottom:5px;">${name}</h3>
                            <p style="font-size:13px; color:#555; margin-bottom:8px;">Rs. ${price}</p>
                            ${actionButton}
                        </div>
                    `;
                });
            })
            .catch(err => {
                console.error("Error loading products:", err);
                document.getElementById('perfume-list').innerHTML = '<div class="loading">उत्पाद लोड करने में समस्या आई।</div>';
            });
    </script>
</body>
</html>
