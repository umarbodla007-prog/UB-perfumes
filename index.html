<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- गूगल साइट वेरिफिकेशन टैग -->
    <meta name="google-site-verification" content="K3TaRCvOiyp29o8nM_OL7_dqZcPhPGoSS_iiDNVADkw" />

    <!-- गूगल खोज (SEO) सेटिंग्स -->
    <title>UB PERFUMES — Haute Parfumerie & Royal Fragrances</title>
    <meta name="description" content="Discover the ultimate bespoke luxury fragrances at UB Perfumes. Handcrafted Royal Kasturi, Chocolate, and Mango Man collections. Available exclusively via Private Order.">
    <meta name="robots" content="index, follow">

    <!-- Ultimate Luxury Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --champagne-gold: #f4e8c1;
            --rich-gold: #d4af37;
            --dark-gold: #aa771c;
            --ultra-gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --bg-deep: #020202;
            --card-velvet: rgba(15, 15, 18, 0.85);
            --border-shimmer: rgba(212, 175, 55, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(212, 175, 55, 0.22) 0%, transparent 55%),
                radial-gradient(circle at 50% 110%, rgba(120, 80, 10, 0.12) 0%, transparent 50%);
            color: #f5f5f5; 
            padding: 0;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Diamond Shimmer Canvas */
        #luxury-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.7;
        }

        header { 
            text-align: center; 
            padding: 40px 20px 20px 20px; 
            position: relative;
            z-index: 2;
        }

        .brand-title { 
            font-family: 'Cinzel', serif; 
            font-size: 32px; 
            letter-spacing: 8px; 
            font-weight: 900; 
            background: var(--ultra-gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            filter: drop-shadow(0 4px 15px rgba(212, 175, 55, 0.4));
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px;
            letter-spacing: 6px;
            color: #d1b876;
            text-transform: uppercase;
            font-style: italic;
        }

        .gold-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 16px auto 0 auto;
            max-width: 240px;
        }

        .ornament-line {
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, transparent, var(--rich-gold), transparent);
        }

        .ornament-diamond {
            width: 6px;
            height: 6px;
            background: var(--rich-gold);
            transform: rotate(45deg);
            box-shadow: 0 0 10px var(--rich-gold);
        }

        .wrapper {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 16px 50px 16px;
            position: relative;
            z-index: 2;
        }

        /* Ultra Royal Hero Banner Slider */
        .slider-stage {
            width: 100%;
            margin: 15px 0 30px 0;
            position: relative;
            border-radius: 26px;
            padding: 2px;
            background: var(--ultra-gold-gradient);
            box-shadow: 0 30px 60px rgba(0,0,0,0.95), 0 0 35px rgba(212, 175, 55, 0.35);
            overflow: hidden;
        }

        .slider-inner {
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1.4s ease-in-out, transform 1.4s ease-in-out;
            transform: scale(1.06);
        }

        .slide.active { opacity: 1; transform: scale(1); z-index: 1; }

        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 30px 20px 20px 20px;
            background: linear-gradient(to top, rgba(2,2,2,0.98) 0%, rgba(2,2,2,0.5) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 2;
        }

        .slide-badge {
            align-self: flex-start;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--rich-gold);
            color: var(--champagne-gold);
            font-size: 8px;
            letter-spacing: 3px;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 6px;
            backdrop-filter: blur(5px);
            font-weight: 600;
        }

        .slide-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .dots-container {
            position: absolute;
            bottom: 18px;
            right: 20px;
            display: flex;
            gap: 6px;
            z-index: 4;
        }

        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            transition: all 0.4s ease;
        }

        .dot.active {
            width: 24px;
            border-radius: 10px;
            background: var(--ultra-gold-gradient);
            box-shadow: 0 0 10px var(--rich-gold);
        }

        /* Section Heading */
        .section-header {
            text-align: center;
            margin: 35px 0 20px 0;
        }

        .section-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 5px;
            color: var(--rich-gold);
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* Ultra Luxury Product Grid */
        .container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 16px; 
        }
        
        .perfume-card { 
            background: var(--card-velvet); 
            border: 1px solid var(--border-shimmer); 
            border-radius: 20px; 
            padding: 14px; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.01);
            backdrop-filter: blur(15px);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .perfume-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 25px 50px rgba(0,0,0,0.95), 0 0 25px rgba(212, 175, 55, 0.4);
        }

        .image-container { 
            width: 100%; 
            padding-top: 100%; 
            position: relative; 
            overflow: hidden; 
            border-radius: 14px; 
            margin-bottom: 12px; 
            background: #000;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .product-img { 
            position: absolute; 
            top:0; left:0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .perfume-card:hover .product-img {
            transform: scale(1.12);
        }

        .perfume-title {
            font-family: 'Cinzel', serif; 
            font-size: 13px; 
            margin-bottom: 6px; 
            font-weight: 700; 
            color: #fff; 
            letter-spacing: 1px;
        }

        .perfume-price-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .perfume-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 19px; 
            color: var(--champagne-gold); 
            font-weight: 700;
            background: var(--ultra-gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .perfume-volume {
            font-size: 8px;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Gold Liquid Order Button */
        .btn { 
            display: block; 
            background: var(--ultra-gold-gradient); 
            color: #030303; 
            text-align: center; 
            padding: 12px 10px; 
            border-radius: 30px; 
            text-decoration: none; 
            font-size: 10px; 
            font-weight: 900; 
            margin-top: auto; 
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:active { 
            transform: scale(0.97); 
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }
        
        .perfume-card.out-of-stock .product-img { filter: grayscale(100%); opacity: 0.35; }
        .btn-out { 
            background: #111; 
            border: 1px solid #222;
            color: #555; 
            cursor: not-allowed; 
            text-align: center; 
            padding: 12px 10px; 
            border-radius: 30px; 
            font-size: 10px; 
            margin-top: auto; 
            font-weight: 700; 
            letter-spacing: 2px;
        }

        .stock-tag { 
            position: absolute; 
            top: 18px; left: 18px; 
            background: rgba(180, 30, 30, 0.9); 
            color: white; 
            padding: 4px 10px; 
            font-size: 8px; 
            border-radius: 20px; 
            font-weight: 700; 
            z-index: 2; 
            letter-spacing: 1.5px;
            backdrop-filter: blur(5px);
        }

        .loading { 
            text-align: center; 
            grid-column: span 2; 
            font-family: 'Cinzel', serif;
            font-size: 13px; 
            color: var(--rich-gold); 
            padding: 40px 20px; 
            letter-spacing: 3px; 
        }

        footer {
            margin-top: 50px;
            text-align: center;
            border-top: 1px solid var(--border-shimmer);
            padding-top: 25px;
        }

        .footer-text {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            color: var(--rich-gold);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .footer-sub {
            font-size: 9px;
            color: #666;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Diamond Sparkle Background Canvas -->
    <canvas id="luxury-canvas"></canvas>

    <header>
        <div class="brand-title">UB PERFUMES</div>
        <div class="brand-subtitle">Haute Parfumerie</div>
        <div class="gold-ornament">
            <div class="ornament-line"></div>
            <div class="ornament-diamond"></div>
            <div class="ornament-line"></div>
        </div>
    </header>

    <div class="wrapper">
        <!-- Banner Slider -->
        <div class="slider-stage">
            <div class="slider-inner">
                <div class="slide active">
                    <img class="slide-img" src="https://i.postimg.cc/Gm6NLs43/1784547021297.png" alt="Royal Kasturi">
                    <div class="slide-overlay">
                        <span class="slide-badge">Royal Reserve</span>
                        <h2 class="slide-title">Royal Kasturi</h2>
                    </div>
                </div>
                <div class="slide">
                    <img class="slide-img" src="https://i.postimg.cc/rmnw3h5j/1785151122893.png" alt="Chocolate Fragrance">
                    <div class="slide-overlay">
                        <span class="slide-badge">Exclusive Artisanal</span>
                        <h2 class="slide-title">Chocolate Essence</h2>
                    </div>
                </div>

                <div class="dots-container">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <div class="section-header">
            <h2>SUMMONING PRIVATE COLLECTION</h2>
        </div>

        <div class="container" id="perfume-list">
            <div class="loading">Loading Private Vault...</div>
        </div>

        <footer>
            <div class="footer-text">UB Perfumes Gujarat</div>
            <div class="footer-sub">Handcrafted Bespoke Essences</div>
        </footer>
    </div>

    <script>
        const SHEET_ID = '13rNvj9LgIuMGplhhNrScH8I8cwguZ5inDTzGphm1EqY'; 
        const WHATSAPP_NUMBER = '919898647697'; // आपका सही WhatsApp नंबर

        // Diamond Sparkle Background Particles
        const canvas = document.getElementById('luxury-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Sparkle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.6 + 0.3;
                this.speedY = -(Math.random() * 0.25 + 0.05);
                this.opacity = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.y += this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(244, 232, 193, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 35; i++) particles.push(new Sparkle());

        function animateSparkles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateSparkles);
        }
        animateSparkles();

        // Banner Slider Animation
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        let currentSlide = 0;

        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }, 4000);

        // Instant Lightning-Fast Google Sheet Data Render
        window.renderPerfumes = function(data) {
            const container = document.getElementById('perfume-list');
            container.innerHTML = '';

            if (!data || !data.table || !data.table.rows || data.table.rows.length === 0) {
                container.innerHTML = '<div class="loading">COLLECTION CURRENTLY UNAVAILABLE</div>';
                return;
            }

            data.table.rows.forEach((row) => {
                const cols = row.c;
                if (!cols || !cols[0] || !cols[0].v) return;

                const name = cols[0] ? String(cols[0].v).trim() : '';
                const price = cols[1] && cols[1].v !== null ? String(cols[1].v).trim() : '';
                const img = cols[3] && cols[3].v ? String(cols[3].v).trim() : 'https://via.placeholder.com/200';
                const stockStatus = cols[4] && cols[4].v ? String(cols[4].v).trim().toLowerCase() : '';
                
                const isOutOfStock = stockStatus.includes('out');
                if (!name) return;

                let actionButton = `<a href="https://wa.me/${WHATSAPP_NUMBER}?text=Pranam UB Perfumes, I wish to reserve: ${encodeURIComponent(name)}" target="_blank" class="btn">RESERVE VIA WA</a>`;
                let badge = '';
                let cardClass = 'perfume-card';

                if (isOutOfStock) {
                    actionButton = `<div class="btn-out">SOLD OUT</div>`;
                    badge = `<div class="stock-tag">RESERVED</div>`;
                    cardClass = 'perfume-card out-of-stock';
                }

                container.innerHTML += `
                    <div class="${cardClass}">
                        ${badge}
                        <div class="image-container"><img class="product-img" src="${img}" alt="${name}"></div>
                        <div class="perfume-title">${name}</div>
                        <div class="perfume-price-row">
                            <span class="perfume-price">₹ ${price}</span>
                            <span class="perfume-volume">ATTAR</span>
                        </div>
                        ${actionButton}
                    </div>
                `;
            });
        };

        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:renderPerfumes`;
        script.scriptId = 'gviz-script';
        script.onerror = function() {
            document.getElementById('perfume-list').innerHTML = '<div class="loading">UNABLE TO REACH PRIVATE VAULT</div>';
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
