<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>UB PERFUMES — Haute Parfumerie Royale</title>
    
    <!-- Luxury Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Default Luxury White & Gold */
            --gold-gradient: linear-gradient(135deg, #c5a059 0%, #dfbf7f 30%, #b89742 70%, #856119 100%);
            --gold-solid: #b89742;
            --bg-deep: #ffffff;
            --card-surface: #ffffff;
            --border-gold: rgba(184, 151, 66, 0.25);
            --border-gold-hover: rgba(184, 151, 66, 0.9);
            --text-main: #1a1a1a;
            --text-muted: #777777;
            --header-bg: linear-gradient(to bottom, #ffffff, #fcfbfa);
            --accent-glow: rgba(184, 151, 66, 0.1);
        }

        /* 🇸🇦 Saudi National Day - Deep Immersive Emerald & Gold Vibe */
        body.theme-saudi {
            --gold-gradient: linear-gradient(135deg, #006C35 0%, #009e4f 35%, #D4AF37 75%, #004225 100%);
            --gold-solid: #006C35;
            --border-gold: rgba(0, 108, 53, 0.4);
            --border-gold-hover: rgba(0, 108, 53, 1);
            --accent-glow: rgba(0, 108, 53, 0.18);
            --header-bg: linear-gradient(to bottom, #f0fdf4, #dcfce7);
            --card-surface: #fbfefc;
        }

        /* 🪔 Diwali / Festive - Warm Golden Orange Vibe */
        body.theme-diwali {
            --gold-gradient: linear-gradient(135deg, #e65c00 0%, #F9D423 50%, #FF4E50 100%);
            --gold-solid: #e65c00;
            --border-gold: rgba(230, 92, 0, 0.4);
            --border-gold-hover: rgba(230, 92, 0, 1);
            --accent-glow: rgba(230, 92, 0, 0.18);
            --header-bg: linear-gradient(to bottom, #fffaf5, #ffeeda);
            --card-surface: #fffdfa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-deep);
            color: var(--text-main); 
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 70%),
                radial-gradient(circle at 50% 100%, var(--accent-glow) 0%, transparent 70%);
            transition: all 0.8s ease;
        }

        header { 
            text-align: center; 
            padding: 40px 20px 25px 20px; 
            border-bottom: 2px solid var(--border-gold);
            background: var(--header-bg);
            transition: all 0.8s ease;
        }

        /* Massive Immersive Vibe Banner */
        #dynamic-banner {
            display: none;
            background: var(--gold-gradient);
            color: #ffffff;
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            padding: 10px 15px;
            font-weight: 700;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 8px 25px var(--accent-glow);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 4px 15px var(--accent-glow); }
            100% { transform: scale(1.02); box-shadow: 0 8px 30px var(--accent-glow); }
        }

        .brand-title { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 34px; 
            letter-spacing: 9px; 
            font-weight: 700; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 8.5px;
            letter-spacing: 5px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .wrapper {
            max-width: 480px;
            margin: 0 auto;
            padding: 30px 14px 70px 14px;
        }

        /* Slider Stage */
        .slider-stage {
            width: 100%;
            margin-bottom: 35px;
            border-radius: 16px;
            padding: 2px;
            background: var(--gold-gradient);
            box-shadow: 0 15px 35px var(--accent-glow);
            position: relative;
            transition: all 0.8s ease;
        }

        .slider-inner {
            width: 100%;
            height: 340px;
            background: #ffffff;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease, visibility 1.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .slide.active { opacity: 1; visibility: visible; z-index: 1; }

        .slide-img-frame { width: 100%; height: 240px; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .slide-img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.1)); }

        .slide-caption {
            width: 100%;
            padding: 12px 15px;
            background: #ffffff;
            border-top: 1px solid var(--border-gold);
            text-align: center;
        }

        .slide-tag { font-size: 6.5px; letter-spacing: 3px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; font-weight: 600; }
        .slide-title { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; color: #1a1a1a; letter-spacing: 1.5px; }

        /* Grid Section */
        .section-header { text-align: center; margin: 35px 0 25px 0; position: relative; }
        .section-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 14px; letter-spacing: 5px; color: var(--gold-solid); text-transform: uppercase; font-weight: 700; }
        .section-header::after { content: ''; display: block; width: 50px; height: 1.5px; background: var(--gold-solid); margin: 8px auto 0 auto; opacity: 0.6; }

        .container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; }
        
        .perfume-card { 
            background: var(--card-surface); 
            border: 1.5px solid var(--border-gold); 
            border-radius: 14px; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            transition: all 0.4s ease;
        }

        .perfume-card:hover { transform: translateY(-4px); border-color: var(--border-gold-hover); box-shadow: 0 15px 35px var(--accent-glow); }

        .image-container { width: 100%; padding-top: 100%; position: relative; overflow: hidden; border-radius: 10px; margin-bottom: 12px; background: #ffffff; border: 1px solid rgba(0,0,0,0.03); }
        .product-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s ease; }
        .perfume-card:hover .product-img { transform: scale(1.06); }

        .perfume-title { font-family: 'Cormorant Garamond', serif; font-size: 14px; margin-bottom: 6px; font-weight: 600; color: #1a1a1a; letter-spacing: 0.8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .perfume-price-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
        .price-box { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
        .perfume-price { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--gold-solid); font-weight: 700; }
        .original-price { font-size: 9px; color: #999; text-decoration: line-through; }
        .perfume-volume { font-size: 7px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }

        .btn { 
            display: block; 
            background: var(--gold-gradient); 
            color: #ffffff; 
            text-align: center; 
            padding: 10px 4px; 
            border-radius: 20px; 
            text-decoration: none; 
            font-size: 8px; 
            font-weight: 700; 
            margin-top: auto; 
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 4px 12px var(--accent-glow);
            transition: all 0.3s ease;
        }

        .festival-badge {
            position: absolute; top: 12px; right: 12px;
            background: var(--gold-gradient);
            color: white; padding: 4px 8px; font-size: 6.5px; border-radius: 4px; font-weight: 700; z-index: 2; letter-spacing: 1px; text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        footer { margin-top: 60px; text-align: center; border-top: 2px solid var(--border-gold); padding-top: 30px; }
        .footer-text { font-family: 'Cormorant Garamond', serif; font-size: 12px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 5px; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
    </style>
</head>
<body>

    <header>
        <div id="dynamic-banner">✨ Special Collection Active ✨</div>
        <div class="brand-title">UB Perfumes</div>
        <div class="brand-subtitle">Haute Parfumerie Royale</div>
    </header>

    <div class="wrapper">
        <div class="slider-stage">
            <div class="slider-inner" id="slider-container">
                <div class="slide active">
                    <div class="slide-img-frame"><img class="slide-img" src="https://i.postimg.cc/Gm6NLs43/1784547021297.png" alt="Royal Kasturi"></div>
                    <div class="slide-caption">
                        <div class="slide-tag">Featured Masterpiece</div>
                        <div class="slide-title">Royal Kasturi Essence</div>
                    </div>
                </div>
                <div class="slide">
                    <div class="slide-img-frame"><img class="slide-img" src="https://i.postimg.cc/rmnw3h5j/1785151122893.png" alt="Chocolate Fragrance"></div>
                    <div class="slide-caption">
                        <div class="slide-tag">Private Creation</div>
                        <div class="slide-title">Artisan Chocolate</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section-header"><h2>The Private Vault</h2></div>
        <div class="container" id="perfume-list">
            <div style="text-align:center; grid-column:span 2; padding:40px; font-family:'Cormorant Garamond'; color:#b89742;">LOADING COLLECTION...</div>
        </div>
        <footer>
            <div class="footer-text">UB Perfumes Gujarat</div>
            <div style="font-size:7.5px; color:#999; letter-spacing:2px; font-weight:500;">Handcrafted Bespoke Masterpieces</div>
        </footer>
    </div>

    <script>
        const SHEET_ID = '13rNvj9LgIuMGplhhNrScH8I8cwguZ5inDTzGphm1EqY'; 
        const WHATSAPP_NUMBER = '919898647697'; 

        // Slider Engine
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 4000);

        // Google Sheet Immersive Theme Engine
        window.renderPerfumes = function(data) {
            const container = document.getElementById('perfume-list');
            container.innerHTML = '';
            let activeFestival = '';

            if (data && data.table && data.table.rows) {
                data.table.rows.forEach((row) => {
                    const cols = row.c;
                    if (!cols || !cols[0] || !cols[0].v) return;

                    const name = cols[0] ? String(cols[0].v).trim() : '';
                    const regPrice = cols[1] && cols[1].v ? String(cols[1].v).trim() : '';
                    const img = cols[3] && cols[3].v ? String(cols[3].v).trim() : 'https://via.placeholder.com/200';
                    
                    const offerPrice = (cols.length > 5 && cols[5] && cols[5].v) ? String(cols[5].v).trim() : '';
                    const festival = (cols.length > 6 && cols.length > 6 && cols[6] && cols[6].v) ? String(cols[6].v).trim() : '';
                    
                    if (festival && !activeFestival) activeFestival = festival;

                    let priceHtml = `<span class="perfume-price">₹ ${regPrice}</span>`;
                    if (offerPrice) {
                        priceHtml = `<div class="price-box"><span class="perfume-price">₹ ${offerPrice}</span><span class="original-price">₹ ${regPrice}</span></div>`;
                    }

                    let festivalBadge = festival ? `<div class="festival-badge">${festival}</div>` : '';
                    
                    container.innerHTML += `
                        <div class="perfume-card">
                            ${festivalBadge}
                            <div class="image-container"><img class="product-img" src="${img}" alt="${name}"></div>
                            <div class="perfume-title">${name}</div>
                            <div class="perfume-price-row">
                                ${priceHtml}
                                <span class="perfume-volume">SPRAY</span>
                            </div>
                            <a href="https://wa.me/${WHATSAPP_NUMBER}?text=I%20wish%20to%20order:%20${encodeURIComponent(name)}" class="btn">ORDER VIA WHATSAPP</a>
                        </div>
                    `;
                });
            }

            // Apply Immersive Vibe based on Google Sheet Festival
            if (activeFestival) {
                const banner = document.getElementById('dynamic-banner');
                banner.style.display = 'block';
                
                const fest = activeFestival.toLowerCase();
                if (fest.includes('saudi') || fest.includes('national day')) {
                    document.body.classList.add('theme-saudi');
                    banner.innerHTML = `🇸🇦 Official ${activeFestival} Celebration Collection & Offers 🇸🇦`;
                } else if (fest.includes('diwali')) {
                    document.body.classList.add('theme-diwali');
                    banner.innerHTML = `🪔 Exclusive ${activeFestival} Royal Festive Sale 🪔`;
                } else {
                    banner.innerHTML = `✨ Special ${activeFestival} Event Collection Active ✨`;
                }
            }
        };

        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:renderPerfumes`;
        document.body.appendChild(script);
    </script>
</body>
</html>
